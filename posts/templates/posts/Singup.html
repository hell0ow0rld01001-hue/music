<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> Blue Music</title>

    

    <link rel="stylesheet" href="./css/Style.css">
    <link rel="stylesheet" href="./css/Singup.css">
</head>

<body class="signup-page-body">

    <main class="signup-page">

        <!-- LOGO -->

   

        <!-- SIGN UP CARD -->

        <section class="signup-card">

            <span class="signup-label">
                JOIN BLUE MUSIC
            </span>

            <h1>
                Sing Up
            </h1>

            <p class="signup-subtitle">
                Create your account and start discovering music.
            </p>


            <!-- NAME -->

            <div class="input-group">

                <label for="name">
                    Full name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                >

            </div>


            <!-- EMAIL -->

            <div class="input-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="input-group">

                <label for="confirm-password">
                    Confirm password
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Confirm your password"
                >

            </div>


            <!-- SIGN UP BUTTON -->

            <button
                type="button"
                class="signup-submit"
            >
                Sing Up
            </button>


            <!-- DIVIDER -->

            <div class="signup-divider">

                <span></span>

                <p>OR</p>

                <span></span>

            </div>


            <!-- GOOGLE -->

            <button
                type="button"
                class="social-signup"
            >
                Continue with Google
            </button>


            <!-- LOGIN -->

            <div class="login-link">

                <span>
                    Already have an account?
                </span>

                <a href="login.html">
                    Log in
                </a>

            </div>

        </section>


        <!-- BACK -->

        <a
            href="Home.html"
            class="back-home"
        >
            ← Back to Home
        </a>

    </main>

</body>

</html>
